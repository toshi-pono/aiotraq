name: CI
on:
  push:
    branches: [main, v0.2]
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck both maintained branches against newly published advisories.
    - cron: "23 1 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
  maintenance-audit:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/_validate.yml
    with:
      ref: v0.2
  docs-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, v0.2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit documentation dependency tree
        working-directory: docs
        run: npm audit --package-lock-only
  ci_success:
    name: CI Success
    needs: [validate, maintenance-audit, docs-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require validation to pass
        env:
          PRIMARY: ${{ needs.validate.result }}
          MAINTENANCE: ${{ needs.maintenance-audit.result }}
          DOCS: ${{ needs.docs-audit.result }}
        run: |
          test "$PRIMARY" = success
          test "$MAINTENANCE" = success || test "$MAINTENANCE" = skipped
          test "$DOCS" = success || test "$DOCS" = skipped
