name: Prepare or publish release
run-name: Release ${{ inputs.version }} (${{ inputs.destination }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed on the release branch
        type: string
        required: true
      destination:
        description: Prepare artifacts by default; publishing requires a separate explicit selection
        type: choice
        default: prepare
        options: [prepare, testpypi, pypi]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/poetry_setup
        id: python
        with:
          python-version: "3.11"
      - name: Validate branch and requested version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = branch
          "${{ steps.python.outputs.tooling-python }}" scripts/ci.py metadata --release-branch "$RELEASE_BRANCH"
          test "$(poetry version --short)" = "$REQUESTED_VERSION"
  validate:
    needs: preflight
    uses: ./.github/workflows/_validate.yml
  publish:
    needs: validate
    if: inputs.destination != 'prepare'
    runs-on: ubuntu-latest
    # Configure required reviewers on these environments before enabling publishing.
    environment:
      name: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
      - name: Publish to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
