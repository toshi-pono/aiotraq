[tool.poetry]
name = "aiotraq-message"
version = "0.3.0"
description = "aiotraq Plugin that supports interactive message sending using Streamlit-style syntax for traQ"
authors = ["toshi00"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/toshi-pono/aiotraq"
packages = [{ include = "aiotraq_message" }]
include = ["**/py.typed", "LICENSE"]
keywords = ["traQ", "bot", "message", "aiotraq"]


[tool.poetry.urls]
"Source Code" = "https://github.com/toshi-pono/aiotraq/tree/main/libs/message"


[tool.poetry.dependencies]
python = ">=3.11,<4.0"
aiotraq = ">=0.2.5,<0.4.0"
aiotraq-bot = ">=0.2.5,<0.4.0"
pillow = ">=13.0.0,<14"
numpy = ">=1.26.4,<3"
pandas = ">=2.2.2,<4"
tabulate = ">=0.9,<0.11"
attrs = ">=22.2.0"
httpx = ">=0.27.2,<0.29.0"
httpcore = ">=1.0.9,<2"
anyio = ">=4.14.2,<5"
certifi = ">=2026.10.19"
idna = ">=3.15,<4"
fastapi = ">=0.135.1,<1"
uvicorn = { extras = ["standard"], version = ">=0.27.0,<1" }
starlette = ">=1.3.1,<2"
python-dotenv = ">=1.2.2,<2"
h11 = ">=0.16.0,<1"
pyyaml = ">=6.0.3,<7"


[tool.poetry.group.dev.dependencies]
mypy = ">=1.10,<3.0"
ruff = "==0.17.5"


[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
check_untyped_defs = true


[tool.ruff]
exclude = [".venv", "venv", "__pycache__", ".git"]

line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10
