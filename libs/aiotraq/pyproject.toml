[tool.poetry]
name = "aiotraq"
version = "0.3.0"
description = "Async ready traQ API Client"
authors = ["toshi00"]
license = "MIT"
readme = "README.md"
packages = [{ include = "aiotraq" }]
include = ["**/py.typed", "LICENSE"]
repository = "https://github.com/toshi-pono/aiotraq"
keywords = ["traQ", "API", "async", "httpx"]


[tool.poetry.urls]
"Source Code" = "https://github.com/toshi-pono/aiotraq/tree/main/libs/aiotraq"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
httpx = ">=0.27.2,<0.28.0"
attrs = ">=22.2.0"
python-dateutil = "^2.8.0"
httpcore = ">=1.0.9,<2"
anyio = ">=4.14.2,<5"
certifi = ">=2026.10.19"
idna = ">=3.15,<4"

[tool.poetry.group.dev.dependencies]
types-python-dateutil = "^2.8.0"
mypy = ">=1.10,<3.0"
ruff = "==0.4.10"

[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
check_untyped_defs = true

[tool.ruff]
exclude = [".venv", "venv", "__pycache__", ".git"]

line-length = 120
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10
