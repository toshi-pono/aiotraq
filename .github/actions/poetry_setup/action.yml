name: Python and Poetry
description: Keep modern build tooling separate from the supported runtime Python.
inputs:
  python-version:
    description: Runtime Python version
    required: true
outputs:
  tooling-python:
    description: Python interpreter containing Poetry, pip-audit, uv and Twine
    value: ${{ steps.tools.outputs.python }}
  runtime-python:
    description: Target runtime interpreter
    value: ${{ steps.runtime.outputs.python-path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install isolated release tools
      id: tools
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/aiotraq-tools"
        "$RUNNER_TEMP/aiotraq-tools/bin/python" -m pip install --upgrade "pip==26.3"
        "$RUNNER_TEMP/aiotraq-tools/bin/python" -m pip install \
          "poetry==2.4.1" "pip-audit==2.10.1" "twine==6.2.0" "uv==0.13.8"
        echo "$RUNNER_TEMP/aiotraq-tools/bin" >> "$GITHUB_PATH"
        echo "python=$RUNNER_TEMP/aiotraq-tools/bin/python" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@v5
      id: runtime
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pypoetry/cache
          ~/.cache/pypoetry/artifacts
          ~/.cache/pip
        key: dependencies-${{ runner.os }}-${{ inputs.python-version }}-poetry2.4.1-${{ hashFiles('**/poetry.lock') }}
